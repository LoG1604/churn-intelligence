<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-label="3,368 customers, 5.36M past revenue, 43% churn rate, Champions bring 76% of revenue">
<style>
    .s { font-family: 'Source Sans Pro','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .rise { animation: rise .65s cubic-bezier(.2,.8,.2,1) both; }
    .fade { animation: fade .6s ease both; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    .hbar { transform-box: fill-box; transform-origin: 0% 50%; animation: sweep .9s cubic-bezier(.2,.8,.2,1) both; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: ring 1.8s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .acc { transform-box: fill-box; transform-origin: 0% 50%; animation: sweep 1s cubic-bezier(.2,.8,.2,1) both; }
  </style>
<rect width="1000" height="140" rx="18" fill="#0E1117"/>
<rect x="1" y="1" width="998" height="138" rx="17" fill="none" stroke="#2A3140" stroke-width="2"/>
<g class="rise" style="animation-delay:0.1s">
<rect x="20" y="20" width="227" height="100" rx="12" fill="#161B26" stroke="#2A3140"/>
<text class="s" x="38" y="48" font-size="13" fill="#9AA4B2">Customers</text>
<text class="s" x="38" y="94" font-size="40" fill="#FAFAFA">3,368</text>
<rect class="acc" style="animation-delay:0.4s" x="38" y="106" width="60" height="4" rx="2" fill="#3B4252"/>
</g>
<g class="rise" style="animation-delay:0.30000000000000004s">
<rect x="263" y="20" width="227" height="100" rx="12" fill="#161B26" stroke="#2A3140"/>
<text class="s" x="281" y="48" font-size="13" fill="#9AA4B2">Past revenue</text>
<text class="s" x="281" y="94" font-size="40" fill="#FAFAFA">5.36M</text>
<rect class="acc" style="animation-delay:0.6000000000000001s" x="281" y="106" width="60" height="4" rx="2" fill="#3B4252"/>
</g>
<g class="rise" style="animation-delay:0.5s">
<rect x="506" y="20" width="227" height="100" rx="12" fill="#161B26" stroke="#2A3140"/>
<text class="s" x="524" y="48" font-size="13" fill="#9AA4B2">Churn rate</text>
<text class="s" x="524" y="94" font-size="40" fill="#F87171">43%</text>
<rect class="acc" style="animation-delay:0.8s" x="524" y="106" width="60" height="4" rx="2" fill="#FF4B4B"/>
<circle class="pulse" cx="711" cy="40" r="4.5" fill="#FF4B4B"/>
</g>
<g class="rise" style="animation-delay:0.7000000000000001s">
<rect x="749" y="20" width="227" height="100" rx="12" fill="#161B26" stroke="#2A3140"/>
<text class="s" x="767" y="48" font-size="13" fill="#9AA4B2">Champions: share of revenue</text>
<text class="s" x="767" y="94" font-size="40" fill="#4ADE80">76%</text>
<rect class="acc" style="animation-delay:1.0s" x="767" y="106" width="60" height="4" rx="2" fill="#2E8B57"/>
</g>
</svg>