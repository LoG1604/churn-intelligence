<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Customer Churn Intelligence. Segment, predict, explain, act.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
    <linearGradient id="glowbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1117"/><stop offset="1" stop-color="#1A1020"/></linearGradient>
    <clipPath id="t1"><rect x="50" y="86" width="0" height="64"><animate attributeName="width" from="0" to="620" dur="1.4s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="50" y="160" width="0" height="40"><animate attributeName="width" from="0" to="520" dur="1.3s" begin="2s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .s { font-family: 'Source Sans Pro','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .rise { animation: rise .65s cubic-bezier(.2,.8,.2,1) both; }
    .fade { animation: fade .6s ease both; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    .hbar { transform-box: fill-box; transform-origin: 0% 50%; animation: sweep .9s cubic-bezier(.2,.8,.2,1) both; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: ring 1.8s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .tag { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  </style>
  <rect width="1000" height="320" rx="22" fill="url(#glowbg)"/>
  <rect width="1000" height="320" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="318" rx="21" fill="none" stroke="#2A3140" stroke-width="2"/>

  <g class="rise" style="animation-delay:.1s">
    <rect x="50" y="42" width="258" height="28" rx="14" fill="#FF4B4B"/>
    <text class="s" x="179" y="61" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">AI + DATA SCIENCE PROJECT</text>
  </g>

  <g clip-path="url(#t1)">
    <text class="s" x="50" y="134" font-size="42" font-weight="700" fill="#FAFAFA">Customer Churn Intelligence</text>
  </g>
  <g clip-path="url(#t2)">
    <text class="s" x="50" y="190" font-size="26" fill="#F87171">Segment. Predict. Explain. Act.</text>
  </g>
  <rect y="164" width="3" height="32" fill="#FF4B4B">
    <animate attributeName="x" from="50" to="380" dur="1.3s" begin="2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.4s" repeatCount="indefinite"/>
  </rect>
  <text class="s fade" style="animation-delay:3.4s" x="50" y="222" font-size="16" fill="#9AA4B2">From raw transactions to a retention plan a manager can act on.</text>

  <g class="tag" style="animation-delay:3.7s">
    <rect x="50" y="244" width="150" height="32" rx="16" fill="#161B26" stroke="#2A3140"/>
    <circle cx="68" cy="260" r="4" fill="#4ADE80"/>
    <text class="s" x="80" y="265" font-size="14" fill="#FAFAFA">3,368 customers</text>
  </g>
  <g class="tag" style="animation-delay:3.9s">
    <rect x="212" y="244" width="150" height="32" rx="16" fill="#161B26" stroke="#2A3140"/>
    <circle class="pulse" cx="230" cy="260" r="4" fill="#FF4B4B"/>
    <text class="s" x="242" y="265" font-size="14" fill="#FAFAFA">43% churn rate</text>
  </g>
  <g class="tag" style="animation-delay:4.1s">
    <rect x="374" y="244" width="130" height="32" rx="16" fill="#161B26" stroke="#2A3140"/>
    <circle cx="392" cy="260" r="4" fill="#FBBF24"/>
    <text class="s" x="404" y="265" font-size="14" fill="#FAFAFA">3 segments</text>
  </g>

  <!-- chart card -->
  <g class="rise" style="animation-delay:.5s">
    <rect x="700" y="36" width="260" height="248" rx="14" fill="#161B26" stroke="#2A3140" stroke-width="1.5"/>
    <text class="s" x="720" y="66" font-size="14" font-weight="700" fill="#FAFAFA">Churn rate by segment</text>
  </g>
  <line x1="718" y1="250" x2="942" y2="250" stroke="#2A3140" stroke-width="1.5"/>
  <rect class="bar" style="animation-delay:.9s" x="726" y="220" width="58" height="30" rx="3" fill="#2E8B57"/>
  <rect class="bar" style="animation-delay:1.2s" x="794" y="145" width="58" height="105" rx="3" fill="#F5A300"/>
  <rect class="bar" style="animation-delay:1.5s" x="862" y="100" width="58" height="150" rx="3" fill="#C0392B"/>
  <g class="s fade" style="animation-delay:2.2s" font-size="13" font-weight="700" fill="#FAFAFA" text-anchor="middle">
    <text x="755" y="213">13%</text>
    <text x="823" y="138">46%</text>
    <text x="891" y="93">66%</text>
  </g>
  <g class="s" font-size="11" fill="#9AA4B2" text-anchor="middle">
    <text x="755" y="270">Champions</text>
    <text x="823" y="270">Occasional</text>
    <text x="891" y="270">Lapsed</text>
  </g>
  <circle class="ring" cx="933" cy="108" r="4" fill="#FF4B4B"/>
  <circle class="pulse" cx="933" cy="108" r="4" fill="#FF4B4B"/>
</svg>
