<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Pipeline: data, clean with DuckDB and SQL, RFM features and churn label, XGBoost model, SHAP and KMeans, retention plan in Streamlit">
<style>
    .s { font-family: 'Source Sans Pro','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .rise { animation: rise .65s cubic-bezier(.2,.8,.2,1) both; }
    .fade { animation: fade .6s ease both; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    .hbar { transform-box: fill-box; transform-origin: 0% 50%; animation: sweep .9s cubic-bezier(.2,.8,.2,1) both; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: ring 1.8s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
